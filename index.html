<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Village: Rise of Clans</title><link rel="stylesheet" href="style.css"></head><body>
<div id="splash"><div class="logo">🏰</div><h1>روستا: ظهور قبیله‌ها</h1><p>۴۵ روز، ۵ قبیله، ۸ نیرو</p>
<button id="btnContinue">▶ ادامه بازی</button><button id="btnNew" class="ghost">↺ شروع دوباره (منابع ۱۰۰۰×)</button>
<button id="btnHelp" class="ghost">؟ راهنما</button><div id="helpBox" hidden>با http://localhost:8000 باز کن. هر سربازخانه صف جدا دارد. بچ ۱/۱۰/۵۰/۱۰۰.</div></div>
<div id="game" hidden><div id="topbar"><span id="res-food">🌾 0</span><span id="res-wood">🪵 0</span><span id="res-stone">🪨 0</span><span id="res-iron">⛓️ 0</span><span id="res-gold">🪙 0</span><span id="dayLabel">روز ۱/۴۵</span></div>
<div id="tabs"><button id="tabWorld" class="on">🌍 جهان</button><button id="tabCastle">🏰 قلعه</button></div>
<canvas id="cv"></canvas>
<div id="dock"><button data-act="build">🏠<small>ساخت</small></button><button data-act="train">⚔️<small>سرباز</small></button><button data-act="attack">🎯<small>حمله</small></button><button data-act="clan">👑<small>قبیله</small></button></div>
<div id="sheet" hidden><div id="sheetCard"><div id="sheetHead"><b id="sheetTitle"></b><button id="sheetClose">✕</button></div><div id="sheetBody"></div></div></div>
<div id="toast"></div></div><script type="module" src="app.js"></script></body></html>
